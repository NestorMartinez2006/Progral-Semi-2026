<form id="frmBusquedaAlumno">
    <div class="card theme-secondary" style="min-width:700px;">
        <div class="card-header">
            <div class="d-flex">
                Busqueda de Alumnos
                <div class="ms-auto">
                    <button data-form="busqueda_alumno" type="button" class="btn-close" aria-label="Close"></button>
                </div>
            </div>
        </div>
        <div class="card-body">
            <table id="tblConsultaAlumnos" class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th colspan="6">
                            <input type="search" class="form-control" placeholder="Buscar alumnos por codigo, nombre"
                                   name="txtBuscarAlumno" id="txtBuscarAlumno" />
                        </th>
                    </tr>
                    <tr>
                        <th>CODIGO</th>
                        <th>NOMBRE</th>
                        <th>DIRECCION</th>
                        <th>TELEFONO</th>
                        <th>EMAIL</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</form>
<script>
    (function () {
        const inputBuscar = document.getElementById("txtBuscarAlumno");
        if (inputBuscar) {
            inputBuscar.addEventListener("keyup", () => listarAlumnos(inputBuscar.value));
        }
        listarAlumnos("");
    })();

    async function listarAlumnos(buscar = "") {
        const tbody = document.querySelector("#tblConsultaAlumnos > tbody");
        if (!tbody) return;

        const termino = encodeURIComponent(String(buscar ?? "").trim());
        let resp = await fetch(`/api/Alumnos/buscar?buscar=${termino}`);
        if (resp.status === 404) {
            resp = await fetch(`/api/Alumnoes/buscar?buscar=${termino}`);
        }

        let alumnos = [];
        if (resp.ok) {
            const texto = await resp.text();
            alumnos = texto ? JSON.parse(texto) : [];
        }

        if (!Array.isArray(alumnos)) {
            alumnos = [];
        }

        let filas = "";
        alumnos.forEach(alumno => {
            const payload = encodeURIComponent(JSON.stringify(alumno));
            filas += `
                <tr onclick="mostrarDatosAlumno(JSON.parse(decodeURIComponent('${payload}')))">
                    <td>${alumno.codigo ?? alumno.Codigo ?? ""}</td>
                    <td>${alumno.nombre ?? alumno.Nombre ?? ""}</td>
                    <td>${alumno.direccion ?? alumno.Direccion ?? ""}</td>
                    <td>${alumno.telefono ?? alumno.Telefono ?? ""}</td>
                    <td>${alumno.email ?? alumno.Email ?? ""}</td>
                    <td>
                        <input type="button"
                               onclick="eliminarAlumno(JSON.parse(decodeURIComponent('${payload}')), event)"
                               class="btn btn-outline-danger btn-sm"
                               value="DEL" />
                    </td>
                </tr>
            `;
        });
        tbody.innerHTML = filas;
    }

    async function eliminarAlumno(alumno, e) {
        if (e) {
            e.preventDefault();
            e.stopPropagation();
        }
        if (confirm(`Esta seguro de eliminar ${(alumno.nombre ?? alumno.Nombre ?? "").trim()}?`)) {
            const id = alumno.idAlumno ?? alumno.IdAlumno;
            let respuesta = await fetch(`/api/Alumnos/${id}`, {
                method: "DELETE",
                headers: { "Content-Type": "application/json" }
            });
            if (respuesta.status === 404) {
                respuesta = await fetch(`/api/Alumnoes/${id}`, {
                    method: "DELETE",
                    headers: { "Content-Type": "application/json" }
                });
            }
            const datos = await respuesta.text();
            if (datos && datos.length > 0) {
                alert(`Error ${datos}`);
                return;
            }
            const inputBuscar = document.getElementById("txtBuscarAlumno");
            listarAlumnos(inputBuscar ? inputBuscar.value : "");
        }
    }

    function mostrarDatosAlumno(alumno) {
        if (typeof modificarAlumno === "function") {
            modificarAlumno(alumno);
        }
    }
</script>
